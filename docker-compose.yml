services:
  salesman-db:
    image: postgres:16-alpine
    container_name: salesman-db
    environment:
      POSTGRES_USER: salesman
      POSTGRES_PASSWORD: salesman
      POSTGRES_DB: salesman
    ports:
      - "5433:5432"
    volumes:
      - salesman-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesman -d salesman"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: product
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: order_svc
      POSTGRES_DB: order_svc
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_svc -d order_svc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salesman-db-data:
  product-db-data:
  order-db-data:
